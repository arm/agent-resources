# Arm Agent Resources -- registry
#
# Single source of truth for the registry. One entry per resource.
# See README.md for the schema, the category / context vocabulary, and the
# contribution rules (only already open-sourced / Anaqua-cleared codebases and
# public docs).
#
# Validated in CI against schema.json (.github/workflows/validate.yml). Category
# subfiles and per-developer-context views are generated from this file as the
# list grows -- keep the source here single and unduplicated.

resources:
  - name: Arm MCP Server
    url: https://github.com/arm/mcp
    category: mcp-servers
    contexts: [cloud-development, compiled-languages, performance-optimization]
    when_to_use: >-
      Gives an AI assistant Arm-specific tools -- semantic search over Arm docs and
      learning resources, x86->Arm code-migration analysis, container-architecture
      checks, and running Arm Performix profiling recipes over SSH. Reach for it when
      you need grounded Arm knowledge or want to check, port, or profile code for Arm.
    example_use_case: >-
      A team porting a Python/C++ service from x86 to Graviton is unsure which
      dependencies are Arm-ready. The agent queries the Arm MCP Server to
      semantic-search Arm's docs and run a migration and container-architecture scan
      across the codebase and image, gets back the specific packages that need an
      aarch64 build plus the recommended fixes, and applies them so the service builds
      and passes on Graviton.

  - name: Arm Performix
    url: https://developer.arm.com/servers-and-cloud-computing/arm-performix
    category: profiling-optimization
    contexts: [performance-optimization, cloud-development, ml-developer]
    when_to_use: >-
      Free performance-analysis toolkit for workloads on Arm servers and cloud
      (Neoverse / Graviton). Use it to find where time actually goes -- function-level
      insight, visualizations, and guided recommendations derived from hardware-level
      execution data -- before and after a change. Runnable standalone (see the
      learn.arm.com install guide) or through the Arm MCP Server's recipe tool.
    example_use_case: >-
      A team porting a JSON-heavy API from x86 to Graviton finds it ~40% slower in
      staging than expected. The agent runs an Arm Performix recipe against the live
      service on the Graviton box, pinpoints the cost in a parser byte-scanning loop
      that fell back to a generic path with no Arm SIMD, swaps in a SIMD-enabled parser
      build, and re-profiles to confirm latency drops back in line -- clearing the
      migration to ship.
