# Arm Agent Resources -- registry index (progressive discovery)
#
# An agent reads this small index first, picks the categories relevant to the
# developer's task, and loads only those registry/<category>.yaml files -- keeping
# context small. Entry format, the category / context vocabulary, and the
# contribution rules live in README.md.
#
# Validated in CI: this index against schema/index.json, each category file against
# schema/entry-file.json (.github/workflows/validate.yml). The counts below are
# checked against the actual files, so they cannot drift.

categories:
  - key: mcp-servers
    title: MCP servers
    description: >-
      Model Context Protocol servers that hand an AI assistant Arm-specific tools.
    file: registry/mcp-servers.yaml
    count: 1

  - key: knowledge-bases
    title: Knowledge bases & documentation
    description: >-
      Searchable Arm documentation and knowledge sources.
    count: 0

  - key: learning-paths
    title: Learning paths & tutorials
    description: >-
      Step-by-step guides from learn.arm.com and their source repos.
    count: 0

  - key: profiling-optimization
    title: Profiling & optimization
    description: >-
      Tools and guides for measuring and improving software performance on Arm.
    file: registry/profiling-optimization.yaml
    count: 1

  - key: sdks-tools
    title: SDKs & tools
    description: >-
      Libraries, SDKs, and command-line tools for building on Arm.
    count: 0

  - key: reference-implementations
    title: Reference implementations
    description: >-
      Example projects and reference code targeting Arm.
    count: 0
