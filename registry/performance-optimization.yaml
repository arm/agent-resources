# Context: performance-optimization
# Resources relevant to the "performance-optimization" developer context. The context is
# implied by this file's name. Each resource carries its `category`. Keep entries
# alphabetical by name, and bump this context's count in ../registry.yaml on change.
# A resource here that also serves other contexts must appear -- identically -- in
# those files too (CI checks). See ../README.md for the entry format and rules.

resources:
  - name: Arm MCP Server
    url: https://github.com/arm/mcp
    category: mcp-servers
    when_to_use: >-
      Gives an AI assistant Arm-specific tools -- semantic search over Arm docs and
      learning resources, x86->Arm code-migration analysis, container-architecture checks,
      and running Arm Performix profiling recipes over SSH. Reach for it when you need
      grounded Arm knowledge or want to check, port, or profile code for Arm.
    example_use_case: >-
      A team porting a Python/C++ service from x86 to Graviton is unsure which
      dependencies are Arm-ready. The agent queries the Arm MCP Server to semantic-search
      Arm's docs and run a migration and container-architecture scan across the codebase
      and image, gets back the specific packages that need an aarch64 build plus the
      recommended fixes, and applies them so the service builds and passes on Graviton.

  - name: Arm ML Inference Advisor (MLIA)
    url: https://github.com/arm/mlia
    category: profiling-optimization
    when_to_use: >-
      The ML Inference Advisor analyzes a neural network against a target Arm IP (Ethos-U,
      Cortex) and reports how to make it run better -- operator compatibility, performance
      estimates, and optimization (pruning / clustering) guidance. Reach for it before
      deploying a model to an Arm edge target.
    example_use_case: >-
      A team is about to deploy a vision model to an Ethos-U microNPU and is unsure it
      will fit or run fast enough. The agent runs MLIA against the model and target, gets
      back which operators fall off the accelerator, the estimated cycles, and concrete
      optimization advice, applies the suggested clustering, and re-checks -- landing a
      model that maps cleanly onto the NPU.

  - name: Arm Performix
    url: https://developer.arm.com/servers-and-cloud-computing/arm-performix
    category: profiling-optimization
    when_to_use: >-
      Free performance-analysis toolkit for workloads on Arm servers and cloud (Neoverse /
      Graviton). Use it to find where time actually goes -- function-level insight,
      visualizations, and guided recommendations derived from hardware-level execution
      data -- before and after a change. Runnable standalone (see the learn.arm.com
      install guide) or through the Arm MCP Server's recipe tool.
    example_use_case: >-
      A team porting a JSON-heavy API from x86 to Graviton finds it ~40% slower in staging
      than expected. The agent runs an Arm Performix recipe against the live service on
      the Graviton box, pinpoints the cost in a parser byte-scanning loop that fell back
      to a generic path with no Arm SIMD, swaps in a SIMD-enabled parser build, and
      re-profiles to confirm latency drops back in line -- clearing the migration to ship.
