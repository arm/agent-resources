# Context: ml-developer
# Resources relevant to the "ml-developer" developer context. The context is implied
# by this file's name. Each resource carries its `category`. Keep entries alphabetical
# by name, and bump this context's count in ../registry.yaml on change. A resource
# here that also serves other contexts must appear -- identically -- in those files
# too (CI checks). See ../README.md for the entry format and rules.

resources:
  - name: Arm Compute Library
    url: https://github.com/ARM-software/ComputeLibrary
    category: sdks-tools
    when_to_use: >-
      Actively maintained low-level computer-vision and machine-learning
      functions optimized for Arm Cortex-A, Neoverse, and Mali GPUs. Use it for
      production CPU/GPU kernels, build guidance, supported data types, and
      device-specific tuning rather than copying old standalone examples.
    example_use_case: >-
      An Android vision feature spends most of its frame budget in convolution.
      The agent checks the current Compute Library operators and build options,
      integrates the supported optimized path, and uses its tuning guidance to
      reduce latency on the target Mali device.

  - name: Arm Developer Documentation
    url: https://developer.arm.com/documentation
    category: knowledge-bases
    when_to_use: >-
      Arm's canonical library for public architecture and interface
      specifications, implementation-specific TRMs, software and optimization
      guides, tool manuals and release notes, and knowledge-base articles. Use
      specifications for normative behavior, TRMs for named IP, guides for
      recommendations, and KBAs as troubleshooting evidence; select the latest
      revision unless the task targets an older implementation.
    example_use_case: >-
      An agent needs to confirm whether unexpected behavior is architectural,
      implementation-specific, or a tool issue. It finds the relevant public
      document, identifies whether it is a specification, TRM, guide, or KBA,
      checks its revision and scope, and grounds the fix in the strongest
      applicable source instead of a secondary article or stale PDF.

  - name: "Arm Developer: AI"
    url: https://developer.arm.com/ai
    category: knowledge-bases
    when_to_use: >-
      Arm's current cross-platform AI solution hub for models, frameworks,
      libraries, tools, and technical resources from cloud to edge. Start here
      when selecting the Arm AI stack for a workload, then follow the linked
      project or documentation source for exact APIs and supported versions.
    example_use_case: >-
      A team has a model and target class but has not chosen its deployment
      stack. The agent uses the hub to compare the current Arm-supported
      framework, library, and optimization routes, selects the closest fit, and
      validates it against that project's canonical documentation.

  - name: "Arm Developer: Edge AI"
    url: https://developer.arm.com/edge-ai
    category: knowledge-bases
    when_to_use: >-
      Arm's current starting point for deploying AI on resource-constrained
      Cortex-M, Cortex-A, and Ethos-U systems. Use it to discover supported quick
      starts, tools, tutorials, and examples for edge inference, then consult the
      linked technical source for exact target and model constraints.
    example_use_case: >-
      A developer needs to run a vision model within an edge device's memory and
      latency budget. The agent uses the hub to identify the applicable target,
      runtime, optimization, and evaluation flow, then follows the current tool
      documentation to build and measure the deployment.

  - name: Arm Install Guides
    url: https://learn.arm.com/install-guides/
    category: sdks-tools
    when_to_use: >-
      Current, task-focused setup instructions for Arm developer tools,
      compilers, cloud CLIs, containers, and platforms on Linux, Windows, and
      macOS. Use these for installation and environment setup; use Arm Learning
      Paths for end-to-end tutorials after the prerequisites are ready.
    example_use_case: >-
      A developer needs the correct Android or cross-compilation tooling on a
      new workstation. The agent follows the matching Install Guide, verifies
      the installed version and target architecture, and leaves a reproducible
      environment ready for the project tutorial.

  - name: Arm Learning Paths
    url: https://learn.arm.com/learning-paths/
    category: learning-paths
    when_to_use: >-
      Reproducible, code-led tutorials maintained by Arm and its ecosystem for
      servers, laptops, phones, embedded devices, and microcontrollers. Use them
      to accomplish a concrete development or optimization task; use the
      separate Install Guides when only tool setup is needed.
    example_use_case: >-
      A developer wants to optimize a mobile workload but does not yet know the
      Arm-specific workflow. The agent chooses the closest current Learning Path,
      adapts its runnable steps to the repository, and verifies the same outcome
      on the developer's target device.

  - name: Arm Performix
    url: https://developer.arm.com/servers-and-cloud-computing/arm-performix
    category: profiling-optimization
    when_to_use: >-
      Free performance-analysis toolkit for workloads on Arm servers and cloud
      (Neoverse / Graviton). Use it to find where time actually goes -- function-level
      insight, visualizations, and guided recommendations derived from hardware-level
      execution data -- before and after a change. Runnable standalone (see the
      learn.arm.com install guide) or through the Arm MCP Server's recipe tool.
    example_use_case: >-
      A team porting a JSON-heavy API from x86 to Graviton finds it ~40% slower in
      staging than expected. The agent runs an Arm Performix recipe against the live
      service on the Graviton box, pinpoints the cost in a parser byte-scanning loop
      that fell back to a generic path with no Arm SIMD, swaps in a SIMD-enabled parser
      build, and re-profiles to confirm latency drops back in line -- clearing the
      migration to ship.

  - name: ExecuTorch Arm Backend
    url: https://github.com/pytorch/executorch/tree/main/backends/arm
    category: reference-implementations
    when_to_use: >-
      Upstream ExecuTorch implementation and documentation for lowering PyTorch
      models through TOSA to Arm targets, including Ethos-U and Vulkan ML paths.
      Use this external repository for the current supported flow and public API
      boundary because the backend evolves with ExecuTorch itself.
    example_use_case: >-
      A team wants to deploy a quantized PyTorch model on an Arm mobile or edge
      target. The agent follows the current Arm backend prerequisites and target
      API, exports the model to a PTE, and validates delegated operators rather
      than relying on an older out-of-tree walkthrough.

  - name: KleidiAI
    url: https://github.com/ARM-software/kleidiai
    category: sdks-tools
    when_to_use: >-
      Arm-optimized, dependency-light C/C++ micro-kernels for integrating AI
      acceleration into frameworks and runtimes, with variants for Neon, SVE,
      SME, and SME2. Use it when building or tuning the low-level CPU execution
      path of an ML framework, not as an end-user model runtime.
    example_use_case: >-
      A mobile inference runtime has a matrix-multiplication bottleneck on recent
      Arm CPUs. The agent selects a compatible KleidiAI micro-kernel variant,
      integrates its stable API and dispatch conditions, and benchmarks it
      against the runtime's generic kernel.
