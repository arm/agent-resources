# Context: embedded-development
# Resources relevant to the "embedded-development" developer context. The context
# is implied by this file's name. Keep entries alphabetical by name, and bump this
# context's count in ../registry.yaml on change. See ../README.md for rules.

resources:
  - name: Arm Architecture Reference Manual for A-profile
    url: https://developer.arm.com/documentation/ddi0487/latest
    category: knowledge-bases
    when_to_use: >-
      Normative Arm Architecture Reference Manual for current A-profile
      architecture behavior, instruction semantics, system registers, exception
      levels, and memory rules. Check its monthly known-issues companion before
      relying on a detail, and use its release-aligned machine-readable feature,
      register, instruction, and pseudocode packages for tooling. Prefer a
      processor's TRM for implementation-specific behavior and timing; where the
      landing page warns that preview HTML differs, treat the PDF as authoritative.
    example_use_case: >-
      Firmware behaves differently after changing exception level or page-table
      setup. The agent checks the latest Arm ARM pseudocode and constraints plus
      the known-issues document for the relevant register and transition, then
      corrects the sequence without treating one core's observed behavior as the
      architecture contract.

  - name: Arm C Language Extensions (ACLE)
    url: https://github.com/ARM-software/acle
    category: knowledge-bases
    when_to_use: >-
      Canonical, actively maintained specifications for Arm C/C++ language
      extensions, including Neon, MVE, and SVE intrinsics. Use the released
      specification when compiler behavior, intrinsic names, types, or feature
      macros must be exact; use main only when tracking upcoming changes.
    example_use_case: >-
      A mobile engine's handwritten Neon path fails with a newer compiler. The
      agent checks ACLE's released intrinsic and feature-macro definitions,
      replaces the non-portable assumption, and adds a guarded fallback that
      builds across supported Android toolchains.

  - name: Arm Developer Documentation
    url: https://developer.arm.com/documentation
    category: knowledge-bases
    when_to_use: >-
      Arm's canonical library for public architecture and interface
      specifications, implementation-specific TRMs, software and optimization
      guides, tool manuals and release notes, and knowledge-base articles. Use
      specifications for normative behavior, TRMs for named IP, guides for
      recommendations, and KBAs as troubleshooting evidence; select the latest
      revision unless the task targets an older implementation.
    example_use_case: >-
      An agent needs to confirm whether unexpected behavior is architectural,
      implementation-specific, or a tool issue. It finds the relevant public
      document, identifies whether it is a specification, TRM, guide, or KBA,
      checks its revision and scope, and grounds the fix in the strongest
      applicable source instead of a secondary article or stale PDF.

  - name: "Arm Developer: Edge AI"
    url: https://developer.arm.com/edge-ai
    category: knowledge-bases
    when_to_use: >-
      Arm's current starting point for deploying AI on resource-constrained
      Cortex-M, Cortex-A, and Ethos-U systems. Use it to discover supported quick
      starts, tools, tutorials, and examples for edge inference, then consult the
      linked technical source for exact target and model constraints.
    example_use_case: >-
      A developer needs to run a vision model within an edge device's memory and
      latency budget. The agent uses the hub to identify the applicable target,
      runtime, optimization, and evaluation flow, then follows the current tool
      documentation to build and measure the deployment.

  - name: "Arm Developer: Embedded and Microcontrollers"
    url: https://developer.arm.com/embedded-and-microcontrollers
    category: knowledge-bases
    when_to_use: >-
      Arm's current solution hub for embedded, microcontroller, IoT, and related
      edge development, organized around assessing, building, and optimizing a
      system. Start here to discover the applicable Arm tools, documentation,
      tutorials, and ecosystem resources, then follow their canonical sources.
    example_use_case: >-
      A developer is starting firmware for an unfamiliar Arm-based platform.
      The agent uses the hub to locate the current development environment,
      platform material, security guidance, and optimization workflow, then
      validates each choice in the linked product documentation.

  - name: Arm Install Guides
    url: https://learn.arm.com/install-guides/
    category: sdks-tools
    when_to_use: >-
      Current, task-focused setup instructions for Arm developer tools,
      compilers, cloud CLIs, containers, and platforms on Linux, Windows, and
      macOS. Use these for installation and environment setup; use Arm Learning
      Paths for end-to-end tutorials after the prerequisites are ready.
    example_use_case: >-
      A developer needs the correct Android or cross-compilation tooling on a
      new workstation. The agent follows the matching Install Guide, verifies
      the installed version and target architecture, and leaves a reproducible
      environment ready for the project tutorial.

  - name: Arm Learning Paths
    url: https://learn.arm.com/learning-paths/
    category: learning-paths
    when_to_use: >-
      Reproducible, code-led tutorials maintained by Arm and its ecosystem for
      servers, laptops, phones, embedded devices, and microcontrollers. Use them
      to accomplish a concrete development or optimization task; use the
      separate Install Guides when only tool setup is needed.
    example_use_case: >-
      A developer wants to optimize a mobile workload but does not yet know the
      Arm-specific workflow. The agent chooses the closest current Learning Path,
      adapts its runnable steps to the repository, and verifies the same outcome
      on the developer's target device.

  - name: Arm Optimized Routines
    url: https://github.com/ARM-software/optimized-routines
    category: reference-implementations
    when_to_use: >-
      Maintained implementations of common math, string, floating-point, and
      networking routines tuned for Arm processors. Use them as production-grade
      reference code when optimizing a hot primitive or studying how an
      architecture-aware implementation handles dispatch and edge cases.
    example_use_case: >-
      Profiling shows a mobile application is dominated by a standard math or
      string primitive. The agent compares its implementation with the current
      Arm Optimized Routines version, ports the relevant safe optimization or
      selects the optimized library, and benchmarks correctness and speed.

  - name: Arm Toolchain
    url: https://github.com/arm/arm-toolchain
    category: sdks-tools
    when_to_use: >-
      Arm's active LLVM-based toolchain project for bare-metal Arm targets and
      native AArch64 Linux development, including build material, binary releases,
      and separate embedded and Linux getting-started guidance. Use it when the
      compiler, runtime libraries, or target configuration must come from Arm's
      current supported toolchain rather than a generic system LLVM package.
    example_use_case: >-
      A C++ project must build both bare-metal firmware and native AArch64 Linux
      utilities with compatible LLVM tooling. The agent selects the current Arm
      Toolchain releases and target guidance, configures each build explicitly,
      and verifies the resulting binaries against their intended environments.

  - name: ExecuTorch Arm Backend
    url: https://github.com/pytorch/executorch/tree/main/backends/arm
    category: reference-implementations
    when_to_use: >-
      Upstream ExecuTorch implementation and documentation for lowering PyTorch
      models through TOSA to Arm targets, including Ethos-U and Vulkan ML paths.
      Use this external repository for the current supported flow and public API
      boundary because the backend evolves with ExecuTorch itself.
    example_use_case: >-
      A team wants to deploy a quantized PyTorch model on an Arm mobile or edge
      target. The agent follows the current Arm backend prerequisites and target
      API, exports the model to a PTE, and validates delegated operators rather
      than relying on an older out-of-tree walkthrough.

  - name: Learn the Arm Architecture
    url: https://www.arm.com/architecture/learn-the-architecture
    category: knowledge-bases
    when_to_use: >-
      Free conceptual guides to A-, M-, and R-profile architecture and major Arm
      technologies. Use these to understand programming models and concepts
      before consulting a normative specification; use Arm Learning Paths when
      the goal is a runnable end-to-end development task.
    example_use_case: >-
      A developer is unfamiliar with the exception, memory, or vector model
      behind a code change. The agent uses the relevant conceptual guide to build
      the correct mental model, then verifies exact behavior in the applicable
      architecture specification before implementing and testing the change.

  - name: Linux arm64 Documentation
    url: https://docs.kernel.org/arch/arm64/
    category: knowledge-bases
    when_to_use: >-
      Canonical upstream Linux documentation for arm64 boot, userspace ABI,
      hardware capabilities, ACPI, MTE, SVE and SME, CCA, and other kernel-facing
      architecture features. Use it for Linux behavior and interfaces; use Arm's
      architecture specifications for the underlying architectural contract.
    example_use_case: >-
      A Linux application needs to detect and safely use an Arm extension across
      different systems. The agent checks the current arm64 hwcap and userspace
      ABI documentation, implements the supported discovery and state-handling
      path, and avoids depending on a kernel implementation detail.

  - name: Trusted Firmware-A
    url: https://github.com/TrustedFirmware-A/trusted-firmware-a
    category: reference-implementations
    when_to_use: >-
      Reference implementation of secure-world boot and runtime firmware for Arm
      A-profile systems, including PSCI, secure monitor, trusted boot, SCMI, and
      related Arm interfaces. Use it when implementing or debugging platform
      firmware and pair it with the normative specifications it references.
    example_use_case: >-
      A new A-profile board hangs during secure boot or power-state handoff. The
      agent traces the current TF-A platform flow and interface implementation,
      compares it with the board port and cited Arm specification, and fixes the
      integration at the correct firmware boundary.
